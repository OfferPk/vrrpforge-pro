  <text x="1125" y="62" fill="#fb7185" font-family="monospace" font-weight="bold" font-size="10" text-anchor="middle">BFD</text>

  <!-- Presets Strip -->
  <rect x="30" y="110" width="230" height="34" rx="6" fill="rgba(14, 165, 233, 0.2)" stroke="#0ea5e9" stroke-width="1.5" />
  <text x="145" y="132" fill="#38bdf8" font-family="-apple-system, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Enterprise Core VRRPv3 (A+)</text>

