  <text x="845" y="302" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11">✓ Preempt Delay Dampening</text>
  <text x="845" y="318" fill="#94a3b8" font-family="sans-serif" font-size="10">10/10 pts — 60s delay allows BGP convergence</text>

  <rect x="490" y="335" width="320" height="40" rx="4" fill="#0a101c" stroke="#1e2c45" />
  <text x="505" y="352" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11">✓ Sub-Second BFD Failover</text>
  <text x="505" y="368" fill="#94a3b8" font-family="sans-serif" font-size="10">10/10 pts — Peer drops detected in 50ms</text>

  <rect x="830" y="335" width="320" height="40" rx="4" fill="#0a101c" stroke="#1e2c45" />
  <text x="845" y="352" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11">✓ L2 Rogue Master Defense</text>
  <text x="845" y="368" fill="#94a3b8" font-family="sans-serif" font-size="10">10/10 pts — DAI and Port Security protect VIP</text>

