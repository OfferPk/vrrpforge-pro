  <rect x="50" y="305" width="180" height="30" rx="5" fill="#0a101c" stroke="#1e2c45" />
  <text x="60" y="325" fill="#34d399" font-family="monospace" font-size="12">10.0.0.254</text>

  <text x="250" y="295" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Router Physical IP</text>
  <rect x="250" y="305" width="180" height="30" rx="5" fill="#0a101c" stroke="#1e2c45" />
  <text x="260" y="325" fill="#f1f5f9" font-family="monospace" font-size="12">10.0.0.1</text>

  <text x="50" y="365" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Master Priority</text>
  <rect x="50" y="375" width="180" height="30" rx="5" fill="#0a101c" stroke="#1e2c45" />
  <text x="60" y="395" fill="#f1f5f9" font-family="monospace" font-size="12">110 (Track Decr: 30)</text>

  <text x="250" y="365" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Advertisement Interval</text>
  <rect x="250" y="375" width="180" height="30" rx="5" fill="#0a101c" stroke="#1e2c45" />
  <text x="260" y="395" fill="#38bdf8" font-family="monospace" font-size="12">250 ms (Fast)</text>

