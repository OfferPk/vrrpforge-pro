  <text x="490" y="435" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="bold" font-size="14">RFC 5798 VRRPv3 Binary Packet Dissector &amp; Multi-Vendor Synthesizer</text>

  <!-- Hex Dump Display -->
  <rect x="490" y="450" width="660" height="90" rx="6" fill="#06090e" stroke="#1e2c45" />
  <text x="505" y="475" fill="#38bdf8" font-family="monospace" font-size="11">0000   31 01 6e 01 00 19 6b 56 0a 00 00 fe                |1.n...kV....|</text>
  <text x="505" y="505" fill="#94a3b8" font-family="monospace" font-size="10">[VRRPv3 Adver] VRID: 1 | Priority: 110 | Adver: 25cs (250ms) | VIP: 10.0.0.254 | Csum: 0x6b56 (Pseudo-Hdr)</text>

  <!-- Synthesizer Output -->
  <rect x="490" y="555" width="660" height="205" rx="6" fill="#06090e" stroke="#1e2c45" />
  <text x="505" y="578" fill="#10b981" font-family="monospace" font-size="11">! Cisco IOS-XE Production VRRPv3 Syntax</text>
  <text x="505" y="598" fill="#cbd5e1" font-family="monospace" font-size="11">fhrp version vrrp v3</text>
  <text x="505" y="618" fill="#cbd5e1" font-family="monospace" font-size="11">track 1 interface TenGigabitEthernet0/0/1 line-protocol</text>
  <text x="505" y="638" fill="#cbd5e1" font-family="monospace" font-size="11">interface Vlan100</text>
  <text x="505" y="658" fill="#cbd5e1" font-family="monospace" font-size="11"> vrrp 1 address-family ipv4</text>
  <text x="505" y="678" fill="#cbd5e1" font-family="monospace" font-size="11">  address 10.0.0.254 primary</text>
  <text x="505" y="698" fill="#cbd5e1" font-family="monospace" font-size="11">  priority 110</text>
  <text x="505" y="718" fill="#cbd5e1" font-family="monospace" font-size="11">  preempt delay minimum 60</text>
  <text x="505" y="738" fill="#38bdf8" font-family="monospace" font-size="11">  track 1 decrement 30</text>
</svg>
