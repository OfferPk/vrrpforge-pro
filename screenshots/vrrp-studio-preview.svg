  <text x="65" y="650" fill="#cbd5e1" font-family="monospace" font-size="11">Tracked WAN: TenGig0/0/1 (UP)</text>
  <text x="65" y="670" fill="#cbd5e1" font-family="monospace" font-size="11">Current Master Priority: 110</text>
  <text x="65" y="690" fill="#cbd5e1" font-family="monospace" font-size="11">Backup Peer Priority: 100</text>
  <text x="65" y="715" fill="#34d399" font-family="monospace" font-size="10">Failover condition: WAN drop triggers -30 decrement.</text>
  <text x="65" y="735" fill="#34d399" font-family="monospace" font-size="10">New Priority 80 &lt; 100 -> Router-2 assumes Master.</text>

