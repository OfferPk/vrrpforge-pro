<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="masterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="backupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="vipGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGrad)" />

  <text x="500" y="45" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle">Zero-Trust VRRPv3 Gateway Architecture &amp; WAN Tracking</text>
  <text x="500" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">RFC 5798 Sub-Second Failover, Virtual MAC Multiplexing, and Upstream Route Sentry</text>

  <!-- Upstream WAN Clouds -->
  <ellipse cx="250" cy="130" rx="90" ry="35" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text x="250" y="135" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Primary WAN (ISP A)</text>

  <ellipse cx="750" cy="130" rx="90" ry="35" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
  <text x="750" y="135" fill="#94a3b8" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Backup WAN (ISP B)</text>

  <!-- WAN Links -->
  <line x1="250" y1="165" x2="250" y2="230" stroke="#38bdf8" stroke-width="3" />
  <text x="170" y="200" fill="#38bdf8" font-family="monospace" font-size="11">Tracked Line</text>

  <line x1="750" y1="165" x2="750" y2="230" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4" />
  <text x="765" y="200" fill="#94a3b8" font-family="monospace" font-size="11">Standby Link</text>

  <!-- Master Router (Router-1) -->
  <rect x="150" y="230" width="220" height="130" rx="10" fill="url(#masterGrad)" stroke="#38bdf8" stroke-width="2" />
  <text x="260" y="260" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">Master Router (R1)</text>
  <text x="260" y="282" fill="#e0f2fe" font-family="monospace" font-size="12" text-anchor="middle">Base Priority: 110</text>
  <text x="260" y="302" fill="#e0f2fe" font-family="monospace" font-size="11" text-anchor="middle">WAN Tracking: -30 Decr</text>
  <text x="260" y="322" fill="#e0f2fe" font-family="monospace" font-size="11" text-anchor="middle">Primary IP: 10.0.0.1</text>
  <text x="260" y="342" fill="#34d399" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">Active VIP Forwarder</text>

  <!-- Backup Router (Router-2) -->
  <rect x="640" y="230" width="220" height="130" rx="10" fill="url(#backupGrad)" stroke="#64748b" stroke-width="1.5" />
  <text x="750" y="260" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="16" text-anchor="middle">Backup Router (R2)</text>
  <text x="750" y="282" fill="#f1f5f9" font-family="monospace" font-size="12" text-anchor="middle">Base Priority: 100</text>
  <text x="750" y="302" fill="#cbd5e1" font-family="monospace" font-size="11" text-anchor="middle">Preempt Delay: 60s</text>
  <text x="750" y="322" fill="#cbd5e1" font-family="monospace" font-size="11" text-anchor="middle">Primary IP: 10.0.0.2</text>
  <text x="750" y="342" fill="#fbbf24" font-family="monospace" font-size="11" text-anchor="middle">Listening (224.0.0.18)</text>

  <!-- Heartbeat Arrow between R1 and R2 -->
  <path d="M 370 295 L 640 295" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" />
  <text x="505" y="285" fill="#fbbf24" font-family="monospace" font-size="11" text-anchor="middle">VRRPv3 Adver (250ms) + BFD</text>

  <!-- Virtual Router Representation Box -->
  <rect x="360" y="390" width="280" height="90" rx="10" fill="url(#vipGrad)" stroke="#10b981" stroke-width="2" />
  <text x="500" y="420" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="15" text-anchor="middle">Virtual Router (VRID 1)</text>
  <text x="500" y="442" fill="#e0f2fe" font-family="monospace" font-weight="bold" font-size="13" text-anchor="middle">VIP: 10.0.0.254</text>
  <text x="500" y="462" fill="#e0f2fe" font-family="monospace" font-size="11" text-anchor="middle">VMAC: 00:00:5E:00:01:01</text>

  <!-- Active Forwarding Path: R1 -> Virtual Router -->
  <line x1="260" y1="360" x2="420" y2="390" stroke="#10b981" stroke-width="3" />
  <line x1="750" y1="360" x2="580" y2="390" stroke="#64748b" stroke-width="2" stroke-dasharray="4" />

  <!-- L2 Access Switch -->
  <rect x="300" y="510" width="400" height="45" rx="6" fill="#1e293b" stroke="#334155" />
  <text x="500" y="538" fill="#f1f5f9" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">L2 Enterprise Access Switch (Dynamic ARP Inspection &amp; Port Security)</text>
  <line x1="500" y1="480" x2="500" y2="510" stroke="#10b981" stroke-width="3" />

  <!-- Downstream End Hosts -->
  <rect x="340" y="580" width="320" height="45" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
  <text x="500" y="608" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Client Workstations / Servers (Default Gateway: 10.0.0.254)</text>
  <line x1="500" y1="555" x2="500" y2="580" stroke="#38bdf8" stroke-width="2" />
</svg>
